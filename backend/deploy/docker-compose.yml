# ClickBook production stack: nginx (TLS) -> api (gunicorn/uvicorn) -> mongo
# Usage: see deploy/README.md  (one-command: ./deploy/deploy.sh)
name: clickbook

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--bind_ip", "127.0.0.1,mongo", "--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_ROOT_USER}", "-p", "${MONGO_ROOT_PASSWORD}", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file: ../.env.production
    environment:
      MONGO_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      STORAGE_BASE: /data/storage
      STORAGE_PUBLIC_URL: /api/files
    volumes:
      - storage_data:/data/storage      # VPS file storage: originals, thumbnails, previews, print, pdf
    expose: ["8001"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/clickbook.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - web_root:/var/www/clickbook:ro   # optional: exported Expo web build
    logging: *logging

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renew twice a day; nginx reloads certs via the deploy cron (see README).
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    logging: *logging

volumes:
  mongo_data:
  storage_data:
  certbot_etc:
  certbot_www:
  web_root:
