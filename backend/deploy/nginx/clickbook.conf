# clickbook.world — reverse proxy for the ClickBook API (+ optional web build)
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=otp:10m rate=5r/m;

upstream clickbook_api { server api:8001; keepalive 32; }

# HTTP -> HTTPS (keeps the ACME challenge path reachable)
server {
    listen 80;
    server_name clickbook.world www.clickbook.world;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://clickbook.world$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.clickbook.world;
    include /etc/nginx/snippets/ssl.conf;
    return 301 https://clickbook.world$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name clickbook.world;
    include /etc/nginx/snippets/ssl.conf;

    client_max_body_size 25m;          # photo uploads (API enforces 20MB)
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/clickbook.access.log;
    error_log  /var/log/nginx/clickbook.error.log warn;

    # Health check (no rate limit, no logs)
    location = /api/health { access_log off; proxy_pass http://clickbook_api; include /etc/nginx/snippets/proxy.conf; }

    # OTP endpoints: tight rate limit against abuse
    location ~ ^/api/auth/otp/ { limit_req zone=otp burst=5 nodelay; proxy_pass http://clickbook_api; include /etc/nginx/snippets/proxy.conf; }

    # Stored files (images/PDFs): long cache, keys are immutable UUIDs
    location /api/files/ {
        proxy_pass http://clickbook_api;
        include /etc/nginx/snippets/proxy.conf;
        proxy_cache_valid 200 7d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Razorpay webhook must never be rate limited
    location = /api/payments/razorpay/webhook { proxy_pass http://clickbook_api; include /etc/nginx/snippets/proxy.conf; }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://clickbook_api;
        include /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 120s;      # PDF generation
    }

    # Optional: Expo web export served from the same domain (npx expo export -p web)
    location / {
        root /var/www/clickbook;
        try_files $uri $uri/ /index.html =404;
    }
}
