name: Printovera pre-deploy checks

on:
  push:
    branches:
      - wedding-album-v1
  pull_request:
    branches:
      - wedding-album-v1

permissions:
  contents: read

jobs:
  backend-syntax:
    name: Backend Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend Python
        run: python -m compileall -q backend

  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest pytest-xdist pillow pypdf reportlab
      - name: Run isolated PDF renderer regression tests
        working-directory: backend
        run: python -m pytest -n 0 tests/test_pdf_renderer_dimensions.py

  backend-static-analysis:
    name: Backend static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Flake8
        run: python -m pip install flake8
      - name: Check critical Python errors
        run: python -m flake8 backend --select=E9,F63,F7,F82 --count

  backend-integration-tests:
    name: Backend integration tests
    runs-on: ubuntu-latest
    if: ${{ secrets.EXPO_PUBLIC_BACKEND_URL != '' }}
    env:
      EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install integration dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run API integration tests
        working-directory: backend
        run: python -m pytest -n 0 tests/test_clickbook_api.py tests/test_pdf_renderer_dimensions.py

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable Yarn 1
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: yarn lint

  frontend-typescript:
    name: Frontend TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable Yarn 1
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit
