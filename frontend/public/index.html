<!DOCTYPE html>
<!-- ClickBook web shell (WEB TARGET ONLY — never used by the iOS/Android apps).
     Used by Expo's `web.output: "single"` mode for both the dev server and `expo export`.
     Carries the PWA manifest, iOS standalone meta tags and the service-worker registration. -->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Online Photo Album Maker &amp; Premium Photo Books | ClickBook</title>
    <meta name="description" content="Create beautiful wedding photo albums, family photo books and premium personalised albums online with ClickBook. Design, preview and order your memories across India." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="keywords" content="online photo album maker, photo album online India, personalised photo book, custom photo album, wedding photo album, wedding album design online, printed photo albums, family photo book, photo book creator, ClickBook" />
    <link rel="canonical" href="https://clickbook.world/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClickBook" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Online Photo Album Maker &amp; Premium Photo Books | ClickBook" />
    <meta property="og:description" content="Turn your favourite photos into beautiful printed albums with ClickBook. Design, preview and order personalised photo books." />
    <meta property="og:url" content="https://clickbook.world/" />
    <meta property="og:image" content="https://clickbook.world/icons/icon-512.png" />
    <meta property="og:image:alt" content="ClickBook — personalised photo albums" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Online Photo Album Maker &amp; Premium Photo Books | ClickBook" />
    <meta name="twitter:description" content="Design, preview and order beautiful personalised photo albums with ClickBook." />
    <meta name="twitter:image" content="https://clickbook.world/icons/icon-512.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ClickBook",
        "url": "https://clickbook.world/",
        "logo": "https://clickbook.world/icons/icon-512.png",
        "description": "Create beautifully printed photo albums and personalised photo books with ClickBook, a product of Printovera LLP.",
        "sameAs": [
          "https://x.com/clickbookworld",
          "https://www.youtube.com/@clickbookworld",
          "https://in.pinterest.com/clickbookworld/",
          "https://www.instagram.com/clickbookworld/"
        ],
        "parentOrganization": {
          "@type": "Organization",
          "name": "Printovera LLP"
        }
      }
    </script>
    <!-- PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2B2B2E" />
    <meta name="application-name" content="ClickBook" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS standalone (hides Safari chrome when launched from the Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ClickBook" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* React Native Web app shell: keep the root in normal document hit-testing flow.
         Avoid forcing a fixed-position body child: iOS Safari/PWA can retain a stale
         hit-testing layer and make taps appear unresponsive after navigation. */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 100%;
        flex: 1;
        isolation: isolate;
      }
      #root button,
      #root [role="button"],
      #root [role="tab"],
      #root input,
      #root textarea,
      #root select {
        touch-action: manipulation;
      }
      [role="tablist"] [role="tab"] * { overflow: visible !important; }
      [role="heading"], [role="heading"] * { overflow: visible !important; }
    </style>
    <script>
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
        });
      }
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__clickbookInstallPrompt = e;
        window.dispatchEvent(new Event('clickbook:installable'));
      });
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
